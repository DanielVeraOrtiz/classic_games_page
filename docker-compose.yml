services:
  dev:
    stdin_open: true

    tty: true
    
    image: classic_games_page_frontend:dev

    build:
      context: .
      dockerfile: Dockerfile


    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - node-modules-cgp:/app/node_modules

    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"

volumes:
  node-modules-cgp: